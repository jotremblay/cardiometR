# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Ubuntu: chromote sysreqs run add-apt-repository ppa:xtradeb/apps,
      # and Launchpad currently returns GPGKeyTemporarilyNotFoundError.
      # macOS/Windows: PKG_SYSREQS=true makes pak call sysreqs2_command()
      # and fail with "Unknown OS" (darwin/mingw). Skip sysreqs everywhere.
      PKG_SYSREQS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN macOS R 4.6 binaries for knitr, xfun, and readxl are zstd.
      # pak/pkgdepends only extracts gzip/bzip2/xz/zip, so those three
      # must come from source on macOS only.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ runner.os == 'macOS' && 'knitr=?source' || '' }}
            ${{ runner.os == 'macOS' && 'xfun=?source' || '' }}
            ${{ runner.os == 'macOS' && 'readxl=?source' || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
