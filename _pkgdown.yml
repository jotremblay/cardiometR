url: https://jotremblay.github.io/cardiometR/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2E86AB"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: cardiometR
  description: >
    R package for Cardiopulmonary Exercise Testing (CPET) analysis with
    S7 classes, interactive Shiny app, and bilingual PDF reports.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/introduction.html
        - text: "---"
        - text: CPET Analysis
        - text: S7 Classes
          href: articles/s7-classes.html
        - text: Report Generation
          href: articles/reports.html
        - text: "---"
        - text: Shiny Application
        - text: Using the App
          href: articles/shiny-app.html

reference:
  - title: Data Import
    desc: Functions for importing CPET data from metabolic carts
    contents:
      - read_cpet
      - read_cosmed
      - preview_cpet_columns
      - list_cpet_dialects
      - clear_dialect_cache
      - cpet_import_report
      - CpetImportReport

  - title: S7 Classes
    desc: Type-safe data structures for CPET analysis
    contents:
      - Participant
      - CpetMetadata
      - CpetData
      - PeakValues
      - Thresholds
      - ValidationReport
      - CpetAnalysis
      - ReportConfig
      - PreTestConditions
      - ProtocolConfig
      - EconomyMetrics
      - ExerciseQualityCriteria
      - ProtocolQuality
      - DataQualityReport
      - QualityAssessment

  - title: Analysis Functions
    desc: Core analysis operations
    contents:
      - validate
      - average
      - find_peaks
      - detect_thresholds
      - extract_stages
      - summarize_stages
      - detect_protocol_config
      - detect_threshold_range
      - find_time_to_peak
      - check_vo2_plateau
      - check_steady_state
      - has_resting
      - compute_resting_values

  - title: Power and Economy
    desc: Power metrics and movement economy
    contents:
      - compute_map_kuipers
      - fit_vo2_power_slope
      - calculate_economy_metrics
      - calculate_gross_efficiency
      - calculate_running_economy
      - calculate_expected_vo2_cycling
      - calculate_expected_vo2_treadmill

  - title: Quality Assessment
    desc: Test validity and data quality against ACSM criteria
    contents:
      - assess_quality
      - assess_maximal_criteria
      - assess_protocol_quality
      - assess_data_quality

  - title: Visualization
    desc: Plotting functions for CPET data
    contents:
      - plot_cpet_panel
      - plot_v_slope
      - plot_ventilatory_equivalents
      - plot_gas_exchange
      - plot_heart_rate
      - plot_power
      - plot_predicted_comparison
      - plot_vo2_power_slope
      - plot_zscore_strip
      - plot_longitudinal_delta
      - theme_cardiometr
      - palette_cardiometr
      - stratum_band_layer

  - title: Reports
    desc: PDF report generation
    contents:
      - generate_report
      - create_summary_table
      - get_logo

  - title: Shiny Application
    desc: Interactive application
    contents:
      - run_app
      - check_setup

  - title: Internationalization
    desc: Bilingual support (EN/FR)
    contents:
      - tr

  - title: Normative Data
    desc: Reference values and predictions
    contents:
      - starts_with("get_normative")
      - starts_with("calculate_predicted")
      - list_normative_categories
      - compare_vo2peak_registries
      - z_score
      - percentile_from_z

articles:
  - title: Getting Started
    navbar: ~
    contents:
      - introduction

  - title: Advanced Topics
    contents:
      - s7-classes
      - reports
      - shiny-app

news:
  one_page: true

footer:
  structure:
    left: developed_by
    right: built_with
